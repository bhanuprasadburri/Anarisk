<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nimbus-grad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <polygon points="50,10 85,25 85,60 50,90 15,60 15,25" fill="url(#shield-grad)" stroke="url(#nimbus-grad)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cloud / Ninja Visor Elements -->
  <path d="M30 45 C30 38 40 32 50 32 C60 32 70 38 70 45 C73 45 76 48 76 52 C76 56 73 59 69 59 L31 59 C27 59 24 56 24 52 C24 48 27 45 30 45 Z" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Glowing Eye / Sensor Beam -->
  <line x1="38" y1="50" x2="62" y2="50" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="3" fill="#5eead4"/>
  <!-- Signal Nodes -->
  <circle cx="50" cy="72" r="2.5" fill="#14b8a6"/>
  <line x1="50" y1="59" x2="50" y2="70" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
