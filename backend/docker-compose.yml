services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbus_dev_pw}
      POSTGRES_DB: nimbus
    ports:
      - "5432:5432"        # remove for production: the API reaches the DB over the internal network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://nimbus:${POSTGRES_PASSWORD:-nimbus_dev_pw}@db:5432/nimbus
      TEST_DATABASE_URL: postgresql+psycopg://nimbus:${POSTGRES_PASSWORD:-nimbus_dev_pw}@db:5432/nimbus_test
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-this-is-only-a-development-placeholder}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@nimbus.example}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe-Admin-123}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      URL_FETCH_ENABLED: ${URL_FETCH_ENABLED:-false}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
